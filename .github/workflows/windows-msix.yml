name: Windows MSIX

# Builds the unsigned Microsoft Store .msix (see PUBLISHING.md > Windows).
on:
  push:
    branches: [release-tracking]
  workflow_dispatch:

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build .msix
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsix --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: Manabi-msix
          path: desktopApp/build/compose/binaries/main-release/msix/*.msix
          if-no-files-found: error
